name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            gates-backend:latest
            gates-backend:${{ github.sha }}
          cache-from: type=registry,ref=gates-backend:buildcache
          cache-to: type=registry,ref=gates-backend:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to production
        run: |
          echo "Wire your platform here, for example:"
          echo "  - kubectl set image deployment/gates-backend gates-backend=your-registry/gates-backend:${{ github.sha }}"
          echo "  - kubectl rollout status deployment/gates-backend"
          echo "  - kubectl run migrate --rm -it --image=your-registry/gates-backend:${{ github.sha }} -- npm run prisma:deploy"
          echo "Or: SSH + docker compose pull && docker compose up -d && ./scripts/deploy-migrations.sh"

