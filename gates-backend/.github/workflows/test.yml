name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: mysql://test_user:test_password@localhost:3306/test_db

      - name: Run type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://test_user:test_password@localhost:3306/test_db

      - name: Prisma select guard
        run: npm run audit:prisma-selects

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: mysql://test_user:test_password@localhost:3306/test_db
          NODE_ENV: test

      - name: Accounting invariants
        run: npm run test:accounting-invariants
        env:
          DATABASE_URL: mysql://test_user:test_password@localhost:3306/test_db
          NODE_ENV: test

      - name: GL invariants
        run: npm run test:gl-invariants
        env:
          DATABASE_URL: mysql://test_user:test_password@localhost:3306/test_db
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

