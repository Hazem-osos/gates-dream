apiVersion: apps/v1
kind: Deployment
metadata:
  name: gates-backend
  labels:
    app: gates-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gates-backend
  template:
    metadata:
      labels:
        app: gates-backend
    spec:
      containers:
      - name: backend
        image: gates-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gates-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: gates-secrets
              key: redis-url
        - name: KEYCLOAK_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: gates-secrets
              key: keycloak-server-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3001
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gates-backend-service
spec:
  selector:
    app: gates-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3001
  type: LoadBalancer

