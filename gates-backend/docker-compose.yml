version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gates-mysql
    environment:
      MYSQL_ROOT_PASSWORD: gates_password
      MYSQL_DATABASE: gates_erp
      MYSQL_USER: gates_user
      MYSQL_PASSWORD: gates_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../infra/mysql/my.dev.cnf:/etc/mysql/conf.d/gates.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: gates-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gates-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: mysql://gates_user:gates_password@mysql:3306/gates_erp
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      KEYCLOAK_ENABLED: "false"
      MQTT_ENABLED: "false"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: npm run dev

volumes:
  mysql_data:
  redis_data:

